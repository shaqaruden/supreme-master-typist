<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Supreme Master Typist — share card source</title>
<style>
@font-face { font-family: Radio; src: url('../fonts/radiocanada-400.woff2'); font-weight: 400; }
@font-face { font-family: Radio; src: url('../fonts/radiocanada-700.woff2'); font-weight: 700; }
* { box-sizing: border-box; }
html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
body { position: relative; background: #151d2b; color: #f1f3f7; font-family: Radio, sans-serif; padding: 58px 72px; }
header { display: flex; align-items: center; gap: 18px; }
header img { height: 64px; width: 64px; border: 1px solid #344565; border-radius: 16px; }
.eyebrow { font-size: 16px; letter-spacing: .22em; text-transform: uppercase; color: #a5b5d0; }
h1 { position: relative; z-index: 1; margin: 42px 0 0; font-size: 90px; line-height: .99; letter-spacing: -.055em; font-weight: 700; }
h1 span { color: #8eaff0; }
.tagline { position: relative; z-index: 1; font-size: 25px; margin: 26px 0 0; color: #c1ccde; letter-spacing: -.02em; }
footer { position: absolute; left: 72px; right: 72px; bottom: 49px; border-top: 1px solid #34415a; padding-top: 23px; display: flex; justify-content: space-between; color: #a5b5d0; font-size: 16px; }
footer strong { color: #dae4f5; font-weight: 400; }
.keys { position: absolute; right: -40px; top: 185px; width: 375px; transform: rotate(-12deg); opacity: .52; }
.row { display: flex; gap: 12px; margin-bottom: 12px; }
.row:nth-child(2) { margin-left: 25px; }
.row:nth-child(3) { margin-left: 50px; }
.key { width: 79px; height: 79px; border-radius: 14px; border: 1px solid #41506b; background: #1d293d; display: grid; place-items: center; font-size: 28px; color: #778aaa; }
.key.focus { color: #bcd1f9; background: #30486d; border-color: #779bdb; }
@media(max-width:600px) {
 body { padding: 22px 29px; }
 header { gap: 9px; }
 header img { width: 30px; height: 30px; border-radius: 8px; }
 .eyebrow { font-size: 8px; letter-spacing: .18em; }
 h1 { font-size: 40px; margin-top: 16px; }
 .tagline { font-size: 12px; margin-top: 12px; }
 footer { left: 29px; right: 29px; bottom: 17px; padding-top: 11px; font-size: 8px; }
 .keys { width: 160px; right: -26px; top: 78px; }
 .row { gap: 5px; margin-bottom: 5px; }
 .row:nth-child(2) { margin-left: 10px; }
 .row:nth-child(3) { margin-left: 20px; }
 .key { width: 35px; height: 35px; border-radius: 6px; font-size: 12px; }
}
</style>
<header><img src="brand-mark.svg" alt=""><div class="eyebrow">Keyboard practice, with purpose.</div></header>
<h1>Supreme Master<br><span>Typist.</span></h1>
<p class="tagline">Your mistakes. Your next move.</p>
<div class="keys" aria-hidden="true">
 <div class="row"><div class="key">S</div><div class="key">M</div><div class="key">T</div><div class="key">↵</div></div>
 <div class="row"><div class="key">A</div><div class="key focus">B</div><div class="key">C</div><div class="key">D</div></div>
 <div class="row"><div class="key">X</div><div class="key">Y</div><div class="key">Z</div></div>
</div>
<footer><strong>Targeted drills · Local progress · Skill-based ranks</strong><span>Find your rhythm.</span></footer>
</html>
